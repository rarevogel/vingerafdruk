<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>Vingerafdruk</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --bg: #f3efe6; --card: #fffdf8; --ink: #23201b; --ink-2: #57514a; --ink-3: #8a8279; --line: #e2dbcd; --accent: #8a2f2a; --accent-2: #b6463e;
  --font: "IBM Plex Sans", system-ui, sans-serif; --serif: "IBM Plex Serif", Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
#app { max-width: 1240px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top, 0)) 14px calc(24px + env(safe-area-inset-bottom, 0)); display: grid; gap: 16px; }
@media (min-width: 900px) and (orientation: landscape) {
  #app { grid-template-columns: minmax(380px, 520px) 1fr; align-items: start; }
  #left { position: sticky; top: 12px; }
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h1 { font: 600 26px/1.1 var(--serif); margin: 4px 0; letter-spacing: -.01em; }
header .sub { color: var(--ink-3); font-size: 13px; }
#print { position: relative; aspect-ratio: 400 / 520; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 10px 30px rgb(60 40 20 / .10); }
#img canvas, #grow { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#grow { z-index: 2; }
#print.growing #ov { opacity: 0; }
#ov { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; transition: opacity .3s; }
.ov-veld line { stroke: #1f8a70; stroke-width: 1.3; stroke-linecap: round; opacity: .8; }
.m .hit { fill: transparent; stroke: none; cursor: pointer; }
.einde line, .einde circle { stroke: #d6332b; fill: none; stroke-width: 1.8; }
.splitsing line, .splitsing rect { stroke: #2459d8; fill: none; stroke-width: 1.8; }
.eiland path { stroke: #128a3e; fill: rgb(18 138 62 / .15); stroke-width: 1.8; }
.meer ellipse { stroke: #8a3fc7; fill: none; stroke-width: 1.8; }
.kern circle { stroke: #c2185b; fill: rgb(194 24 91 / .12); stroke-width: 2.4; }
.kern .dot { fill: #c2185b; stroke: none; }
.delta path { stroke: #e07b00; fill: rgb(224 123 0 / .15); stroke-width: 2.4; stroke-linejoin: round; }
.ov-tel line { stroke: #23201b; stroke-width: 1.6; stroke-dasharray: 5 4; }
.ov-tel rect { fill: #23201b; }
.ov-tel text { fill: #fff; font: 600 13px var(--font); text-anchor: middle; }
#status { position: absolute; left: 12px; bottom: 10px; z-index: 4; font-size: 13px; color: var(--ink-2); background: rgb(255 253 248 / .85); padding: 2px 8px; border-radius: 6px; }
#status:empty { display: none; }
#tip { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 5; background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 30px rgb(0 0 0 / .18); font-size: 14px; }
#tip b { font-family: var(--serif); font-size: 16px; }
#tip p { margin: 4px 0 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 0; border-radius: 10px; padding: 10px 14px; min-height: 44px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn.main { background: var(--accent); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .5; }
.seedbox { display: inline-flex; align-items: center; gap: 0; margin-left: auto; }
.seedbox input { width: 96px; padding: 9px 10px; border: 1px solid var(--line); border-right: 0; border-radius: 10px 0 0 10px; background: var(--card); font-variant-numeric: tabular-nums; min-height: 44px; }
.seedbox button { border-radius: 0 10px 10px 0; }
.controls { display: grid; gap: 10px; margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); width: 92px; flex: none; }
select { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); min-height: 42px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chips button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 7px 12px; min-height: 36px; font-size: 13.5px; color: var(--ink-2); }
.chips button.on { background: var(--ink); color: #fff; box-shadow: none; }
.card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 0 var(--line); margin-bottom: 12px; }
.card h2 { font: 600 19px/1.25 var(--serif); margin: 0 0 6px; }
.card p { margin: 6px 0; }
.mut { color: var(--ink-3); font-size: 13.5px; }
table.mt { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
.mt td { padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.mt td:nth-child(3) { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.mt td:nth-child(2) { white-space: nowrap; font-weight: 500; }
.mt .tot td { border-bottom: 0; font-weight: 600; }
@media (max-width: 520px) { .mt td:nth-child(4) { display: none; } }
.sym { display: inline-block; width: 14px; height: 14px; margin-top: 3px; }
.sym.einde { border: 2px solid #d6332b; border-radius: 50%; }
.sym.splitsing { border: 2px solid #2459d8; }
.sym.punt, .sym.korte-rif { border: 2px solid #128a3e; transform: rotate(45deg) scale(.8); }
.sym.meertje { border: 2px solid #8a3fc7; border-radius: 50%; }
dialog { border: 0; border-radius: 16px; padding: 16px; width: min(1100px, calc(100vw - 20px)); max-height: 92vh; background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(30 20 10 / .5); }
dialog h3 { font: 600 20px var(--serif); margin: 0 0 10px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <header><div><h1>Vingerafdruk</h1><div class="sub">verzonnen afdrukken, uitgelegd</div></div></header>
    <div id="print"><div id="img"></div><canvas id="grow" hidden></canvas><svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg><div id="status"></div><div id="tip" hidden></div></div>
    <div class="actions">
      <button class="btn main" id="newBtn"><svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>Nieuwe afdruk</button>
      <button class="btn" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M11 4h2v9.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM5 18h14v2H5z"/></svg>Opslaan</button>
      <button class="btn" id="cardBtn"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v4h3V7zm5 0v4h4V7zm6 0v4h3V7zM5 13v4h3v-4zm5 0v4h4v-4zm6 0v4h3v-4z"/></svg>Tienvingerkaart</button>
      <span class="seedbox"><input id="seed" inputmode="numeric" aria-label="Nummer"><button class="btn" id="seedGo">Toon</button></span>
    </div>
    <div class="controls">
      <div class="row"><label>Patroon</label><select id="patSel"></select></div>
      <div class="row"><label>Vinger</label><select id="handSel"></select><select id="fingerSel"></select></div>
      <div class="row"><label>Minutiae</label><div class="chips" id="minChips"></div></div>
      <div class="row"><label>Afdruk</label><div class="chips" id="styleChips"></div></div>
      <div class="row"><label>Tonen</label><div class="chips" id="ovChips"></div></div>
    </div>
  </div>
  <div id="explain"></div>
</div>
<dialog id="card"><h3>Tienvingerkaart</h3><div id="cardBody"></div><div class="actions" style="justify-content:flex-end"><button class="btn" id="cardClose">Sluiten</button><button class="btn main" id="cardSave">Opslaan</button></div></dialog>
<div id="toast" hidden></div>
<script>/* Vingerafdruk: the plan of a fingerprint before any ridge exists.
   Shape of the fingertip, the pattern class with its cores and deltas, the ridge orientation field (the zero-pole
   model of Sherlock and Monro, bent along the fingertip at the top) and the ridge spacing. */
"use strict";

const W = 400, H = 520;

// small seeded random generator (mulberry32), so a number always gives the same print
function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + (hi - lo) * r();
  r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return r;
}

// smooth value noise on a coarse grid, bicubic-ish (smoothstep) interpolation, values about -1..1
function noiseField(r, cell, w = W, h = H) {
  const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, g = new Float32Array(gw * gh);
  for (let i = 0; i < g.length; i++) g[i] = r() * 2 - 1;
  const s = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy), tx = s(fx - ix), ty = s(fy - iy);
    const at = (i, j) => g[Math.min(gh - 1, Math.max(0, j)) * gw + Math.min(gw - 1, Math.max(0, i))];
    const a = at(ix, iy) + (at(ix + 1, iy) - at(ix, iy)) * tx;
    const b = at(ix, iy + 1) + (at(ix + 1, iy + 1) - at(ix, iy + 1)) * tx;
    return a + (b - a) * ty;
  };
}

const PATTERNS = {
  boog: { name: "Boog", group: "boog" },
  tentboog: { name: "Tentboog", group: "boog" },
  lusL: { name: "Lus (opent naar links)", group: "lus" },
  lusR: { name: "Lus (opent naar rechts)", group: "lus" },
  krul: { name: "Krul", group: "krul" },
  dubbel: { name: "Dubbele lus", group: "krul" },
};
const FINGERS = ["duim", "wijsvinger", "middelvinger", "ringvinger", "pink"];
// rough chances per finger used by this app: [arch, tented arch, ulnar loop, radial loop, whorl, double loop]
const FINGER_ODDS = {
  duim: [0.03, 0.01, 0.5, 0.02, 0.34, 0.1],
  wijsvinger: [0.08, 0.07, 0.3, 0.17, 0.3, 0.08],
  middelvinger: [0.05, 0.02, 0.65, 0.02, 0.22, 0.04],
  ringvinger: [0.02, 0.01, 0.48, 0.01, 0.42, 0.06],
  pink: [0.01, 0.01, 0.82, 0.01, 0.13, 0.02],
};
// on the print of a right hand the little-finger side is on the right, so an ulnar loop opens to the right
const loopFor = (hand, kind) => ((hand === "rechts") === (kind === "ulnair") ? "lusR" : "lusL");
function pickPattern(r, hand, finger) {
  const odds = FINGER_ODDS[finger], keys = ["boog", "tentboog", "ulnair", "radiaal", "krul", "dubbel"];
  let x = r() * odds.reduce((a, b) => a + b, 0), k = 0;
  while (x > odds[k] && k < odds.length - 1) x -= odds[k++];
  const key = keys[k];
  return key === "ulnair" || key === "radiaal" ? { pattern: loopFor(hand, key), loopKind: key } : { pattern: key, loopKind: null };
}

/* Builds the plan. opts: { seed, pattern (or "auto"), hand, finger, minutiae: "weinig"|"normaal"|"veel" } */
function makePlan(opts) {
  const r = rng(opts.seed);
  const hand = opts.hand === "auto" ? r.pick(["links", "rechts"]) : opts.hand;
  const finger = opts.finger === "auto" ? r.pick(FINGERS) : opts.finger;
  let pattern = opts.pattern, loopKind = null;
  if (pattern === "auto") ({ pattern, loopKind } = pickPattern(r, hand, finger));
  else if (pattern === "ulnair" || pattern === "radiaal") { loopKind = pattern; pattern = loopFor(hand, loopKind); }
  else if (pattern === "lusL" || pattern === "lusR") loopKind = (pattern === "lusR") === (hand === "rechts") ? "ulnair" : "radiaal";

  // fingertip outline: rounder at the top, flatter towards the first joint
  const cx = W / 2 + r.range(-8, 8), cy = H * 0.53 + r.range(-6, 6);
  const shape = { cx, cy, a: r.range(150, 172), bt: r.range(212, 240), bb: r.range(175, 205), nt: r.range(2.0, 2.4), nb: r.range(2.8, 3.8) };
  const rad = (x, y) => { const dx = Math.abs(x - shape.cx) / shape.a, dy = y - shape.cy; const b = dy < 0 ? shape.bt : shape.bb, n = dy < 0 ? shape.nt : shape.nb; return Math.pow(Math.pow(dx, n) + Math.pow(Math.abs(dy) / b, n), 1 / n); };

  // singular points
  const cores = [], deltas = [];
  const P = (dx, dy) => ({ x: cx + dx, y: cy + dy });
  if (pattern === "tentboog") {
    const c = P(r.range(-15, 15), r.range(-25, 5));
    cores.push(c); deltas.push({ x: c.x + r.range(-8, 8), y: c.y + r.range(55, 80) });
  } else if (pattern === "lusL" || pattern === "lusR") {
    const s = pattern === "lusR" ? -1 : 1; // the delta lies on the side opposite to the opening
    const c = P(r.range(-18, 18) - s * 15, r.range(-45, -5));
    cores.push(c); deltas.push({ x: c.x + s * r.range(95, 135), y: c.y + r.range(85, 125) });
  } else if (pattern === "krul") {
    const c = P(r.range(-12, 12), r.range(-35, -10));
    cores.push(c, { x: c.x + r.range(-10, 10), y: c.y + r.range(16, 28) });
    deltas.push(P(-r.range(110, 135), r.range(75, 110)), P(r.range(110, 135), r.range(75, 110)));
  } else if (pattern === "dubbel") {
    const s = r() < 0.5 ? 1 : -1, c = P(r.range(-10, 10), r.range(-30, -10)), d = r.range(26, 36);
    cores.push({ x: c.x - s * d * 0.8, y: c.y - d * 0.6 }, { x: c.x + s * d * 0.8, y: c.y + d * 0.6 });
    deltas.push(P(-r.range(110, 135), r.range(80, 115)), P(r.range(110, 135), r.range(80, 115)));
  }

  // orientation field, stored as doubled-angle vectors (cos 2θ, sin 2θ)
  const n1 = noiseField(r, 90), n2 = noiseField(r, 140), n3 = noiseField(r, 70);
  const archA = r.range(55, 85), archW = r.range(95, 130), archY = cy + r.range(-10, 40);
  const cos2 = new Float32Array(W * H), sin2 = new Float32Array(W * H), period = new Float32Array(W * H), mask = new Float32Array(W * H);
  const P0 = r.range(8.4, 10.2);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let th;
    if (!cores.length) {
      // plain arch: the flow lines are bumps y = c - A exp(-x²/w²), highest in the middle of the finger
      const dx = x - cx, A = archA * Math.exp(-Math.pow((y - archY) / 170, 2));
      th = Math.atan(2 * A * dx / (archW * archW) * Math.exp(-dx * dx / (archW * archW)));
    } else {
      th = 0;
      for (const c of cores) th += 0.5 * Math.atan2(y - c.y, x - c.x);
      for (const d of deltas) th -= 0.5 * Math.atan2(y - d.y, x - d.x);
    }
    th += 0.1 * n1(x, y) + 0.05 * n3(x, y);
    let c2 = Math.cos(2 * th), s2 = Math.sin(2 * th);
    // near the top and sides the ridges follow the round fingertip
    const dx = x - cx, dy = y - cy, rr = rad(x, y);
    const up = Math.min(1, Math.max(0, (-dy / shape.bt + 0.15) / 0.5));
    const wgt = up * Math.min(1, Math.max(0, (rr - 0.5) / 0.4));
    if (wgt > 0) {
      const b = shape.bt, ph = Math.atan2(-dx / (shape.a * shape.a), dy / (b * b));
      const tc = Math.cos(2 * ph), ts = Math.sin(2 * ph);
      c2 = c2 * (1 - wgt) + tc * wgt; s2 = s2 * (1 - wgt) + ts * wgt;
      const l = Math.hypot(c2, s2) || 1; c2 /= l; s2 /= l;
    }
    cos2[i] = c2; sin2[i] = s2;
    // ridge spacing: slightly wider around the core, a little variation everywhere
    let p = P0 + 0.7 * n2(x, y);
    for (const c of cores) p += 0.8 * Math.exp(-((x - c.x) ** 2 + (y - c.y) ** 2) / (2 * 70 * 70));
    period[i] = Math.max(6.5, Math.min(13, p));
    mask[i] = rr;
  }
  const dens = { weinig: 0.6, normaal: 1, veel: 1.8 }[opts.minutiae || "normaal"];
  return { seed: opts.seed, hand, finger, pattern, loopKind, shape, cores, deltas, cos2, sin2, period, rad: mask, P0, dens, r };
}
if (typeof module !== "undefined") module.exports = { W, H, rng, makePlan, PATTERNS, FINGERS, FINGER_ODDS };
</script>
<script>/* Vingerafdruk: growing the ridges.
   Start with a few random specks and filter them over and over with a Gabor filter that follows the local ridge
   direction and spacing (as in SFinGe, Cappelli, Maio and Maltoni). The specks grow into ridges; where two growing
   ridge systems meet out of step, ridge endings and bifurcations appear by themselves.
   Runs on the GPU with WebGL; a slower CPU version takes over when WebGL is missing. */
"use strict";

const Gabor = (() => {
  const ITER = 34;
  const VERT = "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }";
  const STEP = `precision highp float;
uniform sampler2D state, field;
uniform vec2 size;
uniform float gain;
void main() {
  vec2 px = gl_FragCoord.xy;
  vec4 f = texture2D(field, px / size);
  float th = 0.5 * atan(f.g * 2.0 - 1.0, f.r * 2.0 - 1.0);
  float P = 4.0 + f.b * 16.0;
  vec2 t = vec2(cos(th), sin(th)), n = vec2(-t.y, t.x);
  float sn = P * 0.40, st = P * 0.55;
  float acc = 0.0, wsum = 0.0;
  for (int j = -6; j <= 6; j++) for (int i = -6; i <= 6; i++) {
    vec2 d = vec2(float(i), float(j));
    float a = dot(d, n), b = dot(d, t);
    float g = exp(-a * a / (2.0 * sn * sn) - b * b / (2.0 * st * st)) * cos(6.2831853 * a / P);
    acc += g * (texture2D(state, (px + d) / size).r * 2.0 - 1.0);
    wsum += abs(g);
  }
  float v = clamp(acc / wsum * gain, -1.0, 1.0);
  gl_FragColor = vec4(v * 0.5 + 0.5, 0.0, 0.0, 1.0);
}`;
  // shows the growing state while the GPU works (flipped, because GL rows run bottom-up)
  const SHOW = `precision mediump float;
uniform sampler2D state; uniform vec2 size;
void main() { vec2 uv = vec2(gl_FragCoord.x / size.x, 1.0 - gl_FragCoord.y / size.y); float v = texture2D(state, uv).r; gl_FragColor = vec4(vec3(1.0 - smoothstep(0.45, 0.7, v) * 0.85), 1.0); }`;

  let gl = null, progs = null, buf = null, cv = null;
  function initGL(canvas) {
    if (gl) return gl;
    cv = canvas;
    gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false }) || canvas.getContext("experimental-webgl");
    if (!gl) return null;
    const prog = (fs) => {
      const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      return p;
    };
    try {
      // some phones only offer mediump; then fall back to the CPU
      const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
      if (!hp || hp.precision < 16) throw new Error("geen highp");
      progs = { step: prog(STEP), show: prog(SHOW) };
    } catch (e) { gl = null; return null; }
    buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    return gl;
  }
  function tex(w, h, data) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
    return t;
  }
  function draw(p) {
    const loc = gl.getAttribLocation(p, "p");
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

<script>/* Vingerafdruk: reading the finished print like an examiner would.
   Thins the ridges to one-pixel lines (Zhang-Suen), finds minutiae with the crossing number (1 = ridge ending,

<script>/* Vingerafdruk: making the ridges look like a real print (ink on a card, a live scanner, or dusted powder)

"use strict";

  return (x, y) => {

/* ---------- overlays (SVG in print coordinates) ---------- */
const NS = "http://www.w3.org/2000/svg";

function overlays(svg, plan, an, show) {

    const g = svgEl("g", { class: "ov-veld" });

    const g = svgEl("g", { class: "ov-tel" });

    svg.append(g);

      const a = svgEl("g", { class: "m " + (m.type === "einde" ? "einde" : "splitsing"), "data-k": "m" + k });
      a.append(svgEl("line", { x1: m.x, y1: m.y, x2: tx, y2: ty }));
      a.append(m.type === "einde" ? svgEl("circle", { cx: m.x, cy: m.y, r: 4.2 }) : svgEl("rect", { x: m.x - 4, y: m.y - 4, width: 8, height: 8 }));
      a.append(svgEl("circle", { cx: m.x, cy: m.y, r: 11, class: "hit" }));
      g.append(a);
    });
    an.islands.forEach((m, k) => { const a = svgEl("g", { class: "m eiland", "data-k": "i" + k }); a.append(svgEl("path", { d: `M${m.x} ${m.y - 6} L${m.x + 6} ${m.y} L${m.x} ${m.y + 6} L${m.x - 6} ${m.y} Z` })); a.append(svgEl("circle", { cx: m.x, cy: m.y, r: 11, class: "hit" })); g.append(a); });
    an.lakes.forEach((m, k) => { const a = svgEl("g", { class: "m meer", "data-k": "l" + k }); a.append(svgEl("ellipse", { cx: m.x, cy: m.y, rx: 7, ry: 7 })); a.append(svgEl("circle", { cx: m.x, cy: m.y, r: 11, class: "hit" })); g.append(a); });
    svg.append(g);
  }
  if (show.singulier) {
    const g = svgEl("g", { class: "ov-sing" });
    plan.cores.forEach((c, k) => { const a = svgEl("g", { class: "m kern", "data-k": "c" + k }); a.append(svgEl("circle", { cx: c.x, cy: c.y, r: 9 })); a.append(svgEl("circle", { cx: c.x, cy: c.y, r: 2.2, class: "dot" })); a.append(svgEl("circle", { cx: c.x, cy: c.y, r: 14, class: "hit" })); g.append(a); });

    svg.append(g);
  }
}

<script>/* Vingerafdruk: the app. Makes a print, explains what is in it, shows overlays, saves PNGs and ten-print cards. */
"use strict";

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const Bridge = window.VAApp || null;
const MM = 25.4 / 500; // one pixel at 500 ppi, the usual resolution for fingerprints
const nl = (x, d = 1) => x.toLocaleString("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- settings ---------- */
const KEY = "vingerafdruk-instellingen";
const S = Object.assign({ pattern: "auto", hand: "auto", finger: "auto", style: "inkt", minutiae: "normaal", veld: false, singulier: true, minutiaeOv: true, telling: true },
  (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };

/* ---------- making a print ---------- */
let cur = null, busy = false;
// the growth leaves more forks than endings; real fingers have rather more endings, so cut some branches near their fork
function balance(plan, v, an) {
  const r = rng(plan.seed ^ 0x2545f491), out = Float32Array.from(v), P = plan.P0;
  for (const m of an.minutiae) {
    if (m.type !== "splitsing" || r() > 0.55) continue;
    const s = r() < 0.5 ? 1 : -1, a = m.angle + s * 0.55;
    const cx = m.x + Math.cos(a) * P * 0.85, cy = m.y + Math.sin(a) * P * 0.85, rad = P * 0.36;
    for (let y = Math.floor(cy - rad); y <= cy + rad; y++) for (let x = Math.floor(cx - rad); x <= cx + rad; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const d = Math.hypot(x - cx, y - cy);
      if (d < rad) out[y * W + x] = Math.min(out[y * W + x], -0.6 * (1 - d / rad) - 0.2);
    }
  }
  return out;
}
async function generate(opts, growCanvas, onStep) {
  const plan = makePlan(opts);
  let v = await Gabor.grow(plan, growCanvas, onStep);
  let an = analyze(plan, v);
  v = balance(plan, v, an);
  an = analyze(plan, v);
  return { plan, v, an };
}
async function newPrint(seed) {
  if (busy) return;
  busy = true;
  $("#newBtn").disabled = true;
  const opts = { seed: seed ?? Math.floor(Math.random() * 999999) + 1, pattern: S.pattern, hand: S.hand, finger: S.finger, minutiae: S.minutiae };
  $("#seed").value = opts.seed;
  const grow = $("#grow");
  grow.hidden = false; $("#print").classList.add("growing");
  $("#status").textContent = "Riffen groeien…";
  try {
    const res = await generate(opts, grow, (k, n) => { $("#status").textContent = `Riffen groeien… ${Math.round(k / n * 100)}%`; });
    res.style = S.style;
    res.canvas = paint(res.plan, res.v, res.an, S.style);
    cur = res;
    showPrint();
    explain();
    $("#status").textContent = Gabor.gpu ? "" : "Gemaakt zonder grafische versnelling";
  } catch (e) { $("#status").textContent = "Mislukt: " + (e.message || e); }
  grow.hidden = true; $("#print").classList.remove("growing");
  busy = false;
  $("#newBtn").disabled = false;
}
function showPrint() {
  const holder = $("#img");
  holder.replaceChildren(cur.canvas);
  drawOverlays();
}
function drawOverlays() {
  if (!cur) return;
  overlays($("#ov"), cur.plan, cur.an, { veld: S.veld, singulier: S.singulier, minutiae: S.minutiaeOv, telling: S.telling });
}
function restyle(style) {
  S.style = style; save();
  if (!cur) return;
  cur.canvas = paint(cur.plan, cur.v, cur.an, style);
  cur.style = style;
  showPrint();
}

/* ---------- explanation ---------- */
const FINGER_NAME = { duim: "duim", wijsvinger: "wijsvinger", middelvinger: "middelvinger", ringvinger: "ringvinger", pink: "pink" };
const handName = (h) => (h === "rechts" ? "rechter" : "linker");
function patternTitle(p) {
  if (p.pattern === "lusL" || p.pattern === "lusR") return `Lus (${p.loopKind})`;
  return PATTERNS[p.pattern].name;
}
const TEXT = {
  boog: "De riffen komen aan de ene kant binnen, buigen in het midden een beetje omhoog en lopen aan de andere kant weer weg. Er is geen kern en geen delta. Bogen zijn het zeldzaamste patroon: ongeveer 5% van alle vingers.",
  tentboog: "Een boog waarvan de riffen in het midden steil omhoog worden geduwd, als door een tentstok. Bovenin zit een kern, vlak daaronder een delta. Tentbogen horen bij de bogen en zijn zeldzaam; je ziet ze het vaakst op wijsvingers.",
  lus: "Riffen komen aan één kant binnen, maken een haarspeldbocht om de kern en gaan aan dezelfde kant weer naar buiten. Er is één kern en één delta; de delta ligt aan de kant tegenover de opening. Lussen zijn het gewoonste patroon: ongeveer 60 tot 65% van alle vingers.",
  krul: "De riffen draaien in cirkels, ovalen of een spiraal rond het midden. Een krul heeft twee delta's, links en rechts onderin. Ongeveer 30 tot 35% van de vingers heeft een krul; op duimen en ringvingers zie je ze het vaakst.",
  dubbel: "Twee lussen die om elkaar heen draaien, zoals de twee helften van een yin-yangteken. Er zijn twee kernen en twee delta's. In de klassieke indeling (Henry) valt de dubbele lus onder de krullen.",
};
const MIN_TEXT = {
  einde: ["Rifeinde", "Een rif houdt gewoon op. Het streepje wijst de kant op waar de rif ophoudt."],
  splitsing: ["Splitsing", "Eén rif splitst zich in twee (bifurcatie). Het streepje wijst de kant op waar de vork opengaat."],
  punt: ["Punt", "Een stukje rif zo kort dat het een stip is."],
  "korte rif": ["Korte rif", "Een los, kort stukje rif tussen de andere riffen (ook wel eilandje)."],
  meertje: ["Meertje", "Een rif splitst zich en komt kort daarna weer samen. Het lege stukje ertussen heet een meertje (enclosure)."],
  kern: ["Kern", "Het binnenste punt van de binnenste bocht van het patroon. Vanaf hier wordt geteld en gemeten."],
  delta: ["Delta", "Hier komen riffen uit drie richtingen samen en ontstaat een driehoekje, zoals de Griekse letter Δ of een riviermonding."],
};
function explain() {
  const { plan, an } = cur, p = plan;
  const count = (t) => an.minutiae.filter((m) => m.type === t).length + an.islands.filter((m) => m.type === t).length + (t === "meertje" ? an.lakes.length : 0);
  const sections = [];
  const sec = (title, ...body) => sections.push(el("section", { class: "card" }, el("h2", {}, title), ...body));
  const fingerTxt = `${handName(p.hand)} ${FINGER_NAME[p.finger]}`;

  // pattern
  const grp = p.pattern === "lusL" || p.pattern === "lusR" ? "lus" : p.pattern;
  const pBody = [el("p", {}, TEXT[grp])];
  if (grp === "lus") {
    const side = p.pattern === "lusR" ? "rechts" : "links";
    pBody.push(el("p", {}, `Deze lus opent naar ${side}. Op een afdruk van de ${handName(p.hand)}hand ligt de pinkkant ${p.hand === "rechts" ? "rechts" : "links"}, dus dit is een `,
      el("b", {}, p.loopKind === "ulnair" ? "ulnaire lus" : "radiale lus"),
      p.loopKind === "ulnair" ? ": hij opent naar de pinkkant, waar de ellepijp (ulna) ligt. Dat is verreweg de gewoonste soort." : ": hij opent naar de duimkant, waar het spaakbeen (radius) ligt. Radiale lussen zijn zeldzaam en komen vooral voor op wijsvingers."));
  }
  sec(`${patternTitle(p)} · ${fingerTxt}`, ...pBody);

  // core and delta
  const cd = [];
  cd.push(el("p", {}, `Kernen: ${p.cores.length || "geen"}. Delta's: ${p.deltas.length || "geen"}. `, p.cores.length ? "De kern is het binnenste punt van het patroon, de delta het driehoekje waar riffen uit drie richtingen samenkomen." : "Een gewone boog heeft geen kern en geen delta; daarom is hij ook niet te tellen."));
  if (an.ridgeCounts.length && (grp === "lus" || grp === "krul" || grp === "dubbel")) {
    const rc = an.ridgeCounts.map((r) => r.count);
    cd.push(el("p", {}, grp === "lus"
      ? `Tussen kern en delta liggen ${rc[0]} riffen. Deze rijtelling (Galton) gebruikten politiediensten om lussen verder in te delen: je trekt een denkbeeldige lijn van delta naar kern en telt de riffen die hij kruist.`
      : `Rijtelling van de kern naar de linker- en rechterdelta: ${rc.join(" en ")} riffen. Bij krullen werd in de Henry-indeling vooral gekeken hoe de rif vanaf de linkerdelta langs de rechterdelta loopt (binnen, buiten of erlangs).`));
  } else if (grp === "tentboog") cd.push(el("p", {}, "Bij een tentboog liggen kern en delta vlak boven elkaar; er liggen (bijna) geen riffen tussen, dus een rijtelling heeft geen betekenis."));
  sec("Kern en delta", ...cd);

  // ridges
  const period = p.P0 * MM, perCm = 10 / period;
  const widthMM = (p.shape.a * 2) * MM, heightMM = (p.shape.bt + p.shape.bb) * MM;
  sec("Riffen",
    el("p", {}, `De riffen liggen gemiddeld ${nl(period, 2)} mm uit elkaar: zo'n ${Math.round(perCm)} riffen per centimeter. Bij volwassenen is dat meestal ongeveer 0,4 tot 0,5 mm; bij kinderen liggen ze dichter op elkaar. Rond de kern liggen ze in deze afdruk iets verder uit elkaar.`),
    el("p", {}, `Het afgedrukte deel is ongeveer ${nl(widthMM, 0)} bij ${nl(heightMM, 0)} mm (bij 500 ppi, de gangbare resolutie voor vingerafdrukken). Riffen zijn verhoogde huidlijsten; ze ontstaan voor de geboorte, rond de tiende tot zestiende week van de zwangerschap, en blijven daarna hetzelfde.`));

  // minutiae
  const rows = [["einde", count("einde")], ["splitsing", count("splitsing")], ["punt", count("punt")], ["korte rif", count("korte rif")], ["meertje", count("meertje")]];
  const total = rows.reduce((a, r) => a + r[1], 0);
  const table = el("table", { class: "mt" }, ...rows.map(([t, n]) => el("tr", {}, el("td", {}, el("span", { class: "sym " + t.replace(" ", "-") })), el("td", {}, MIN_TEXT[t][0]), el("td", {}, String(n)), el("td", { class: "mut" }, MIN_TEXT[t][1]))),
    el("tr", { class: "tot" }, el("td"), el("td", {}, "Totaal"), el("td", {}, String(total)), el("td")));
  sec("Minutiae",
    el("p", {}, "Minutiae zijn de plekken waar een rif ophoudt, splitst of iets anders doet. Patroon en rijtelling zeggen in welke groep een afdruk valt; de minutiae maken hem uniek. Zelfs eeneiige tweelingen hebben verschillende minutiae."),
    table,
    el("p", { class: "mut" }, "Rifeinden en splitsingen zijn veruit het gewoonst. Bij vergelijking kijkt een deskundige naar soort, plek en richting van de minutiae en hoe ze ten opzichte van elkaar liggen. Vroeger eisten veel landen een vast aantal overeenkomende punten (vaak twaalf); nu wordt meestal het geheel beoordeeld. Tik op een teken in de afdruk voor uitleg."));

  // pores
  const ridgeMM = an.skLen * MM;
  sec("Poriën",
    el("p", {}, `Op de riffen zitten ${an.pores.length} zweetporiën: gemiddeld één per ${nl(ridgeMM / Math.max(1, an.pores.length), 2)} mm rif. Ze zijn zichtbaar als witte stipjes in de inkt. Poriën, de vorm van de rifranden en kleine littekens heten het derde niveau van detail. De Franse criminoloog Edmond Locard vergeleek in 1912 al afdrukken op hun poriën (poroscopie); daarvoor is een scherpe afdruk met hoge resolutie nodig.`));

  sec("Over deze afdruk",
    el("p", {}, `Nummer ${p.seed}. Deze afdruk is door de app verzonnen en is van niemand. Eerst wordt een plan gemaakt: de vorm van de vingertop, het patroon met zijn kernen en delta's, de richting van de riffen (het model van Sherlock en Monro) en de rifafstand. Daarna groeien de riffen uit een paar willekeurige stipjes door ze telkens te filteren met een Gabor-filter dat de richting en afstand volgt; dat idee komt van het onderzoeksprogramma SFinGe. Waar twee groeiende rifsystemen elkaar ontmoeten, ontstaan vanzelf rifeinden en splitsingen. Tot slot zoekt de app de minutiae op zoals een programma voor vingerafdrukvergelijking dat doet.`),
    el("p", { class: "mut" }, "Met hetzelfde nummer en dezelfde instellingen krijg je dezelfde afdruk."));
  $("#explain").replaceChildren(...sections);
}

/* ---------- tapping a feature ---------- */
$("#ov").addEventListener("click", (e) => {
  const g = e.target.closest("[data-k]");
  if (!g || !cur) { $("#tip").hidden = true; return; }
  const k = g.dataset.k, kind = k[0], i = +k.slice(1);
  let item, type;
  if (kind === "m") { item = cur.an.minutiae[i]; type = item.type; }
  else if (kind === "i") { item = cur.an.islands[i]; type = item.type; }
  else if (kind === "l") { item = cur.an.lakes[i]; type = "meertje"; }
  else if (kind === "c") { item = cur.plan.cores[i]; type = "kern"; }
  else { item = cur.plan.deltas[i]; type = "delta"; }
  const [title, text] = MIN_TEXT[type];
  let extra = `Plaats: ${nl((item.x - W / 2) * MM, 1)} mm ${item.x < W / 2 ? "links" : "rechts"} van het midden, ${nl(Math.abs(item.y - H / 2) * MM, 1)} mm ${item.y < H / 2 ? "boven" : "onder"} het midden.`.replace("-", "");
  if (item.angle !== undefined) extra += ` Richting: ${Math.round(((-item.angle * 180 / Math.PI) % 360 + 360) % 360)}°.`;
  if (item.len && type === "korte rif") extra += ` Lengte: ${nl(item.len * MM, 1)} mm.`;
  const tip = $("#tip");
  tip.replaceChildren(el("b", {}, title), el("p", {}, text), el("p", { class: "mut" }, extra));
  tip.hidden = false;
  e.stopPropagation();
});
document.addEventListener("click", (e) => { if (!e.target.closest("#tip") && !e.target.closest("#ov [data-k]")) $("#tip").hidden = true; });

/* ---------- saving ---------- */
function saveCanvas(cv, name) {
  cv.toBlob(async (b) => {
    if (Bridge && Bridge.saveFile) {
      const bytes = new Uint8Array(await b.arrayBuffer());
      let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      Bridge.saveFile(name, "image/png", btoa(s));
      return;
    }
    const a = el("a", { href: URL.createObjectURL(b), download: name });
    document.body.append(a); a.click(); a.remove();
  }, "image/png");
}
window.onSaved = (ok) => toast(ok ? "Opgeslagen" : "Niet opgeslagen");
$("#saveBtn").onclick = () => {
  if (!cur) return;
  // with the overlays when they are on
  const cv = document.createElement("canvas");
  cv.width = cur.canvas.width; cv.height = cur.canvas.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(cur.canvas, 0, 0);
  const svg = $("#ov").cloneNode(true);
  svg.setAttribute("width", cv.width); svg.setAttribute("height", cv.height);
  const style = el("style"); style.textContent = OV_CSS; svg.prepend(style);
  svg.querySelectorAll(".hit").forEach((h) => h.remove());
  const img = new Image();
  img.onload = () => { ctx.drawImage(img, 0, 0, cv.width, cv.height); saveCanvas(cv, `vingerafdruk-${cur.plan.seed}.png`); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- ten-print card ---------- */
$("#cardBtn").onclick = async () => {
  if (busy) return;
  busy = true;
  const dlg = $("#card");
  const body = $("#cardBody");
  body.replaceChildren(el("p", { class: "mut", id: "cardStatus" }, "Tien afdrukken maken…"));
  dlg.showModal();
  const base = Math.floor(Math.random() * 99999) * 10 + 1;
  const SC = 0.62, bw = W * SC + 24, bh = H * SC + 54;

  ctx.fillStyle = "#222"; ctx.font = "600 26px 'IBM Plex Sans', sans-serif";
  ctx.fillText("Tienvingerkaart", 22, 42);
  ctx.font = "15px 'IBM Plex Sans', sans-serif"; ctx.fillStyle = "#555";
  ctx.fillText(`Verzonnen afdrukken, gemaakt door Vingerafdruk · nummers ${base} t/m ${base + 9}`, 22, 68);
  const list = [];
  let n = 0;
  for (const hand of ["rechts", "links"]) for (const finger of FINGERS) {
    const res = await generate({ seed: base + n, pattern: "auto", hand, finger, minutiae: S.minutiae }, $("#grow"));
    const pic = paint(res.plan, res.v, res.an, S.style, 1);
    const col = n % 5, row = Math.floor(n / 5), x = 20 + col * bw, y = 90 + row * bh;
    ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, bw - 8, bh - 8);
    ctx.fillStyle = "#222"; ctx.font = "600 15px 'IBM Plex Sans', sans-serif";
    ctx.fillText(`${n + 1}. ${hand === "rechts" ? "R" : "L"}. ${finger}`, x + 10, y + 22);
    ctx.drawImage(pic, x + 8, y + 30, W * SC, H * SC);
    ctx.fillStyle = "#555"; ctx.font = "13px 'IBM Plex Sans', sans-serif";
    ctx.fillText(patternTitle(res.plan), x + 10, y + bh - 16);
    list.push(res.plan);
    n++;
    $("#cardStatus").textContent = `Tien afdrukken maken… ${n}/10`;
  }
  const counts = {};
  for (const p of list) { const t = patternTitle(p).replace(/ \(.*/, ""); counts[t] = (counts[t] || 0) + 1; }
  cv.style.width = "100%";
  body.replaceChildren(cv, el("p", { class: "mut" }, "Op deze kaart: " + Object.entries(counts).map(([k, v]) => `${v}× ${k.toLowerCase()}`).join(", ") + ". Het patroon per vinger is gekozen met kansen die per vinger verschillen, zoals bij echte handen: lussen het meest, krullen vaak op duimen en ringvingers, bogen en radiale lussen vooral op wijsvingers."));
  $("#cardSave").onclick = () => saveCanvas(cv, `tienvingerkaart-${base}.png`);
  busy = false;
};
$("#cardClose").onclick = () => $("#card").close();

/* ---------- controls ---------- */
function chips(id, options, get, set) {
  const box = $(id);
  box.replaceChildren(...options.map(([v, label]) => el("button", { class: get() === v ? "on" : "", onclick: () => { set(v); save(); chips(id, options, get, set); } }, label)));
}
function selectBox(id, options, get, set) {
  const s = $(id);
  s.replaceChildren(...options.map(([v, label]) => el("option", { value: v, selected: get() === v }, label)));
  s.onchange = () => { set(s.value); save(); };
}
function buildControls() {
  selectBox("#patSel", [["auto", "Willekeurig (past bij de vinger)"], ["boog", "Boog"], ["tentboog", "Tentboog"], ["ulnair", "Lus, ulnair (naar de pink)"], ["radiaal", "Lus, radiaal (naar de duim)"], ["krul", "Krul"], ["dubbel", "Dubbele lus"]], () => S.pattern, (v) => (S.pattern = v));
  selectBox("#handSel", [["auto", "Elke hand"], ["rechts", "Rechterhand"], ["links", "Linkerhand"]], () => S.hand, (v) => (S.hand = v));
  selectBox("#fingerSel", [["auto", "Elke vinger"], ...FINGERS.map((f) => [f, f[0].toUpperCase() + f.slice(1)])], () => S.finger, (v) => (S.finger = v));
  chips("#styleChips", Object.entries(STYLES).map(([k, s]) => [k, s.name]), () => S.style, (v) => restyle(v));
  chips("#minChips", [["weinig", "Weinig"], ["normaal", "Normaal"], ["veel", "Veel"]], () => S.minutiae, (v) => (S.minutiae = v));
  const ov = $("#ovChips");
  const tog = (label, key) => el("button", { class: S[key] ? "on" : "", onclick: (e) => { S[key] = !S[key]; save(); e.currentTarget.classList.toggle("on", S[key]); drawOverlays(); } }, label);
  ov.replaceChildren(tog("Kern en delta", "singulier"), tog("Minutiae", "minutiaeOv"), tog("Rijtelling", "telling"), tog("Richting van de riffen", "veld"));
}
$("#newBtn").onclick = () => newPrint();
$("#seedGo").onclick = () => { const n = parseInt($("#seed").value, 10); if (n > 0) newPrint(n); };
$("#seed").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#seedGo").click(); });
window.atlasBack = () => {
  if ($("#card").open) { $("#card").close(); return true; }
  if (!$("#tip").hidden) { $("#tip").hidden = true; return true; }
  return false;
};

let OV_CSS = "";
(async () => {
  OV_CSS = [...document.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch (e) { return []; } }).map((r) => r.cssText).filter((t) => /\.ov-|\.m |\.hit|\.einde|\.splitsing|\.eiland|\.meer|\.kern|\.delta/.test(t)).join("\n");
  buildControls();
  await new Promise((r) => requestAnimationFrame(r));
  newPrint();
})();
</script>
</body>
